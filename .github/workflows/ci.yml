name: ci

# Every push and PR: the router must keep typechecking against pi's own API
# types (a renamed extension method used to fail only at runtime) and keep
# passing the calibration tests.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
